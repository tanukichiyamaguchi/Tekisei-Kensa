# 01 §6.2 の ci.yml。lint・format・型検査・マスタ再生成検査・単体テスト・Emulator 上の結合テスト・build・バンドル検査。
# 実プロジェクト・実 API には接続しない（環境変数はすべてダミー。00 D-33）。
name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4 # Firebase Emulator の実行に Java が必要（01 §6.2 の指定どおり 21。ローカルでも 21 で動作を確認済み）
        with:
          distribution: temurin
          java-version: "21"
      - name: Emulator の JAR をキャッシュ（任意。初回はダウンロードされる）
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Vercel の関数実行環境では CommonJS から ES Module を require() できず、jwks-rsa → jose@6 の読み込みで
      # ERR_REQUIRE_ESM になった（2026-09-23 の本番デプロイ）。package.json の pnpm.overrides で jose@5 に固定しており、
      # その固定が外れていないことを require(esm) を無効にした Node で確かめる
      - name: firebase-admin を require(esm) なしで読み込めることを確認
        run: node --no-experimental-require-module -e "for (const m of ['firebase-admin/app', 'firebase-admin/auth', 'firebase-admin/firestore']) require(m)"
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - name: マスタ生成物が付録と一致していることを確認（08 §7.6）
        run: pnpm masters:check
      - name: 文言マスタの生成物が付録C と一致していることを確認（08 §7.6）
        run: pnpm texts:check
      - run: pnpm test
      - name: Emulator 上の結合テスト（00 D-33）
        run: pnpm test:integration:emu
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-tekisei
          NEXT_PUBLIC_FIREBASE_APP_ID: demo-app-id
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          NEXT_PUBLIC_APP_BASE_URL: http://localhost:3000
          AI_PROVIDER: stub
          AI_MODEL: claude-opus-5
          AI_PROMPT_VERSION: recruitment-v2
          PDF_TOKEN_SECRET: dummy-pdf-token-secret-do-not-ship-0123456789
      - name: ダミーのサービスアカウント鍵を作る（ブラウザ用バンドルへの混入検査用。実在の鍵ではない）
        id: dummy_sa
        run: |
          json='{"project_id":"demo-tekisei","client_email":"dummy-service-account-do-not-ship@example.com","private_key":"dummy-service-account-do-not-ship"}'
          echo "value=$(printf '%s' "$json" | base64 -w 0)" >> "$GITHUB_OUTPUT"
      - name: build（環境変数はダミー。実 API・実プロジェクトには接続しない）
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-tekisei
          NEXT_PUBLIC_FIREBASE_APP_ID: demo-app-id
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ steps.dummy_sa.outputs.value }}
          AI_PROVIDER: stub
          AI_MODEL: claude-opus-5
          AI_PROMPT_VERSION: recruitment-v2
          PDF_TOKEN_SECRET: dummy-pdf-token-secret-do-not-ship-0123456789
      # Vercel の PDF 関数には @sparticuz/chromium の bin/（圧縮済み Chromium）が必要。Turbopack のビルドでは
      # outputFileTracingIncludes が適用されず同梱されなかった（2026-09-23 の本番で browser_launch_failed）ため、
      # build は webpack で行い（package.json）、同梱されていることをここで確かめる
      - name: PDF の関数に Chromium（bin/chromium.br）が同梱されていることを確認
        run: grep -q 'chromium/bin/chromium.br' '.next/server/app/api/v1/admin/results/[resultId]/pdf/route.js.nft.json'
      - name: サーバ専用の値がブラウザ用バンドルに含まれていないことを確認
        run: |
          for needle in dummy-pdf-token-secret-do-not-ship dummy-service-account-do-not-ship; do
            if grep -R "$needle" .next/static >/dev/null 2>&1; then
              echo "サーバ専用の値（$needle）がクライアントバンドルに混入しています"; exit 1; fi
          done
