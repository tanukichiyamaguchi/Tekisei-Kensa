# 01 §6.2 の ci.yml のうち M1 で実行できる部分（lint・format・typecheck・マスタ再生成検査・単体テスト）。
# Firebase Emulator 上の結合テスト、build、バンドル検査は M2 で Next.js・Firebase の導入時に追加する。
name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - name: マスタ生成物が付録と一致していることを確認（08 §7.6）
        run: pnpm masters:check
      - run: pnpm test
